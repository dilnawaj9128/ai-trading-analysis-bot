name: Recovery safety tests (offline)
on:
  pull_request:
    paths:
      - "market_data/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/recovery-offline.yml"
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TWELVE_DATA_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full offline tests
        run: env -u TWELVE_DATA_API_KEY python -m pytest tests/ -q --tb=short
